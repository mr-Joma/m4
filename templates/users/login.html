{% extends 'base.html' %}

{% block title %}Логин{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Вход
                    </h2>

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Введите username"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Введите пароль"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Войти
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
